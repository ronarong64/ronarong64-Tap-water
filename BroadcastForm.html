<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งข่าวสาร ประปาหมู่บ้าน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen relative overflow-x-hidden">

    <div id="toast-container" class="fixed top-3 left-3 right-3 z-[9999] flex flex-col items-end gap-3 pointer-events-none sm:top-6 sm:right-6 sm:left-auto"></div>

    <!-- ⏳ หน้าจอ Loading เช็คสิทธิ์ -->
    <div id="loading-screen" class="w-full max-w-md flex flex-col items-center justify-center py-20">
        <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
        <h3 class="text-lg font-bold text-slate-700">กำลังตรวจสอบสิทธิ์...</h3>
        <p class="text-sm text-slate-500">กรุณารอสักครู่</p>
    </div>

    <!-- ⛔ หน้าต่างป๊อปอัป ไม่มีสิทธิ์เข้าถึง (เพิ่มใหม่ ค้างไว้จนกว่าจะกดปิด) -->
    <div id="unauthorized-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div id="unauthorized-box" class="bg-white rounded-[2rem] p-6 shadow-2xl max-w-xs sm:max-w-sm w-full text-center transform scale-95 transition-all duration-300 relative border border-slate-100">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-50 mb-4 shadow-inner border border-rose-100">
                <i class="fas fa-lock text-2xl text-rose-500"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">ไม่มีสิทธิ์เข้าถึง</h3>
            <p class="text-[14px] text-slate-500 mb-6 leading-relaxed font-medium">
                ⛔ ขออภัยครับ<br>เฉพาะคณะกรรมการหมู่บ้านเท่านั้น<br>ที่สามารถใช้งานส่วนนี้ได้
            </p>
            <button onclick="closeAndExit()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95 shadow-md shadow-rose-500/30">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- 📝 หน้าจอแบบฟอร์ม (ซ่อนไว้ก่อนจนกว่าจะเช็คสิทธิ์ผ่าน) -->
    <div id="form-container" class="bg-white w-full max-w-md rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 hidden">
        <div class="bg-gradient-to-r from-sky-500 to-blue-600 py-4 px-6 text-white shadow-md relative flex items-center gap-4">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl shrink-0 backdrop-blur-sm border border-white/30">
                <i class="fas fa-bullhorn"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold leading-tight">ประกาศ / แจ้งข่าวสาร</h2>
                <p class="text-[11px] text-blue-100 mt-0.5">หมู่ที่ 5 บ้านทับพรุ</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <input type="hidden" id="uid" value="">
            
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center gap-3 shadow-inner mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 overflow-hidden shrink-0">
                    <img id="profile-avatar" class="hidden w-full h-full object-cover" alt="รูปโปรไฟล์ LINE">
                    <span id="profile-avatar-fallback"><i class="fas fa-user-tie"></i></span>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">คณะกรรมการ</div>
                    <div id="profile-name" class="text-sm font-bold text-slate-700 mt-0.5">กำลังเชื่อมต่อ LINE...</div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                <input type="text" id="title" placeholder="เช่น แจ้งท่อประปาชำรุด" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียด <span class="text-red-500">*</span></label>
                <textarea id="detail" rows="3" placeholder="พิมพ์เนื้อหาที่ต้องการแจ้งให้สมาชิกทราบ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รูปภาพประกอบ (ถ้ามี)</label>
                <div class="relative group cursor-pointer border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50 hover:bg-blue-100 transition h-36 flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('imageFile').click()">
                    <img id="preview" class="absolute inset-0 w-full h-full object-cover rounded-2xl hidden z-10">
                    <div id="placeholder" class="text-blue-400 text-center relative z-0 transition-transform group-hover:scale-110">
                        <i class="fas fa-image text-3xl mb-1"></i>
                        <p class="text-xs font-bold">แตะเพื่อเลือกรูปภาพ</p>
                    </div>
                </div>
                <input type="file" id="imageFile" accept="image/*" capture="environment" class="hidden" onchange="previewImage(this)">
            </div>

            <button id="btn-submit" onclick="submitBroadcast()" class="w-full py-4 mt-4 bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-700 hover:to-sky-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all text-sm flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน
            </button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
    <script>
        // ⚠️ ใส่ลิงก์ API Script.google.com ของคุณรณรงค์
        const API_URL = "https://script.google.com/macros/s/AKfycbzq88OZCsNZqxdmfe4otNoypsepDeVj-baYlTwEYIFlTtU9wqiUNKbPh76XJYy4Ys6uTw/exec"; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) {
                console.error('ไม่พบพื้นที่แสดงข้อความแจ้งเตือน');
                return;
            }

            const styles = {
                success: { title: 'สำเร็จ', icon: 'fa-circle-check', iconColor: 'text-emerald-600', iconBg: 'bg-emerald-50', border: 'border-emerald-100', progress: 'bg-emerald-500', duration: 2500 },
                error: { title: 'เกิดข้อผิดพลาด', icon: 'fa-circle-xmark', iconColor: 'text-rose-600', iconBg: 'bg-rose-50', border: 'border-rose-100', progress: 'bg-rose-500', duration: 6000 },
                warning: { title: 'แจ้งเตือน', icon: 'fa-triangle-exclamation', iconColor: 'text-amber-600', iconBg: 'bg-amber-50', border: 'border-amber-100', progress: 'bg-amber-500', duration: 5000 },
                info: { title: 'ข้อมูล', icon: 'fa-circle-info', iconColor: 'text-sky-600', iconBg: 'bg-sky-50', border: 'border-sky-100', progress: 'bg-sky-500', duration: 4200 }
            };
            const style = styles[type] || styles.success;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto w-full overflow-hidden rounded-2xl border ${style.border} bg-white shadow-[0_12px_35px_rgba(15,23,42,0.14)] opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-3 transition-all duration-300`;
            toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
            toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

            const content = document.createElement('div');
            content.className = 'flex items-start gap-3 p-4';
            const iconBox = document.createElement('div');
            iconBox.className = `mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${style.iconBg}`;
            const icon = document.createElement('i');
            icon.className = `fas ${style.icon} ${style.iconColor} text-lg`;
            icon.setAttribute('aria-hidden', 'true');
            iconBox.appendChild(icon);

            const textBox = document.createElement('div');
            textBox.className = 'min-w-0 flex-1 pt-0.5';
            const title = document.createElement('div');
            title.className = 'text-sm font-bold text-slate-800';
            title.textContent = style.title;
            const detail = document.createElement('div');
            detail.className = 'mt-0.5 whitespace-pre-line break-words text-[13px] leading-relaxed text-slate-600';
            detail.textContent = String(message ?? '');
            textBox.append(title, detail);

            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.className = 'flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700';
            closeButton.setAttribute('aria-label', 'ปิดการแจ้งเตือน');
            closeButton.innerHTML = '<i class="fas fa-times" aria-hidden="true"></i>';
            content.append(iconBox, textBox, closeButton);

            const progressTrack = document.createElement('div');
            progressTrack.className = 'h-1 w-full bg-slate-100';
            const progress = document.createElement('div');
            progress.className = `h-full w-full ${style.progress} transition-[width] ease-linear`;
            progress.style.transitionDuration = `${style.duration}ms`;
            progressTrack.appendChild(progress);
            toast.append(content, progressTrack);
            container.appendChild(toast);

            let dismissTimer;
            const dismiss = () => {
                if (!toast.isConnected) return;
                toast.classList.add('opacity-0', 'translate-y-2', 'sm:translate-x-3');
                setTimeout(() => toast.remove(), 300);
            };
            closeButton.addEventListener('click', () => {
                clearTimeout(dismissTimer);
                dismiss();
            });
            toast.addEventListener('mouseenter', () => {
                clearTimeout(dismissTimer);
                progress.style.transitionDuration = '0ms';
                progress.style.width = '100%';
            });
            toast.addEventListener('mouseleave', () => {
                progress.style.transitionDuration = `${style.duration}ms`;
                progress.style.width = '0%';
                dismissTimer = setTimeout(dismiss, style.duration);
            });
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2', 'sm:translate-x-3');
                progress.style.width = '0%';
            });
            dismissTimer = setTimeout(dismiss, style.duration);
        }

        // 🌟 1. ฟังก์ชันแสดงหน้าต่าง ไม่มีสิทธิ์เข้าถึง
        function showUnauthorizedModal() {
            const modal = document.getElementById('unauthorized-modal');
            const box = document.getElementById('unauthorized-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            }, 10);
        }

        // 🌟 2. ฟังก์ชันกดปุ่ม "ปิดหน้าต่าง"
        function closeAndExit() {
            if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
                liff.closeWindow();
            } else {
                window.close(); // สำหรับเปิดในเบราว์เซอร์ปกติ
            }
        }

        window.onload = () => {
            // ⚠️ รหัส LIFF ID ของฟอร์มแจ้งข่าว
            liff.init({ liffId: "2009984616-PQGvzBFq" }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        const lineId = profile.userId;
                        document.getElementById('uid').value = lineId;
                        
                        // 🌟 ยิง API ไปเช็คสิทธิ์ที่ Google Apps Script
                        fetch(API_URL + "?action=checkDirector&lineId=" + lineId)
                            .then(res => res.json())
                            .then(data => {
                                document.getElementById('loading-screen').classList.add('hidden'); // ปิดหน้าโหลด
                                
                                if (data.success && data.isDirector) {
                                    // ถ้าเป็นกรรมการ ให้แสดงฟอร์ม
                                    document.getElementById('profile-name').innerText = data.name || profile.displayName;
                                    if (profile.pictureUrl) {
                                        const avatar = document.getElementById('profile-avatar');
                                        avatar.src = profile.pictureUrl;
                                        avatar.classList.remove('hidden');
                                        document.getElementById('profile-avatar-fallback').classList.add('hidden');
                                    }
                                    document.getElementById('form-container').classList.remove('hidden');
                                } else {
                                    // 🌟 ถ้าไม่ใช่กรรมการ เรียกหน้าต่างแจ้งเตือนขึ้นมาแทนการเด้งปิดทันที
                                    showUnauthorizedModal();
                                }
                            })
                            .catch(err => {
                                document.getElementById('loading-screen').classList.add('hidden');
                                showToast("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ", "error");
                            });

                    });
                } else { liff.login(); }
            });
        };

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const preview = document.getElementById('preview');
                preview.src = URL.createObjectURL(input.files[0]);
                preview.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
            }
        }

        function submitBroadcast() {
            const lineId = document.getElementById('uid').value; 
            const title = document.getElementById('title').value.trim();
            const detail = document.getElementById('detail').value.trim();
            const fileInput = document.getElementById('imageFile');
            const btn = document.getElementById('btn-submit');

            if (!title) return showToast('กรุณาระบุหัวข้อประกาศ', 'warning');
            if (!detail) return showToast('กรุณาระบุรายละเอียดข้อความ', 'warning');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังส่งข้อมูล...';

            const sendData = (base64Img) => {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'sendBroadcast',
                        lineId: lineId, 
                        title: title,
                        detail: detail,
                        imageBlob: base64Img
                    })
                }).then(res => res.json()).then(data => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน';

                    if(data.success) {
                        showToast(data.message, 'success');
                        setTimeout(() => { closeAndExit(); }, 2500);
                    } else {
                        showToast(data.message, 'error');
                    }
                }).catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน';
                    showToast('การเชื่อมต่อล้มเหลว', 'error');
                });
            };

            if (fileInput.files[0]) {
                const img = new Image();
                const objectUrl = URL.createObjectURL(fileInput.files[0]);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl); 
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    sendData(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = objectUrl;
            } else {
                sendData(""); 
            }
        }
    </script>
</body>
</html>
