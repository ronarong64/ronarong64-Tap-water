<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งข่าวสาร ประปาหมู่บ้าน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen relative overflow-x-hidden">

    <div id="toast-container" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[9999] flex flex-col items-center gap-3 pointer-events-none w-full px-6"></div>

    <div class="bg-white w-full max-w-md rounded-[2rem] shadow-xl overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-sky-500 to-blue-600 py-4 px-6 text-white shadow-md relative flex items-center gap-4">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl shrink-0 backdrop-blur-sm border border-white/30">
                <i class="fas fa-bullhorn"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold leading-tight">ประกาศ / แจ้งข่าวสาร</h2>
                <p class="text-[11px] text-blue-100 mt-0.5">หมู่ที่ 2 บ้านหนองบัว</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <input type="hidden" id="uid" value="">
            
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center gap-3 shadow-inner mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">คณะกรรมการ</div>
                    <div id="profile-name" class="text-sm font-bold text-slate-700 mt-0.5">กำลังเชื่อมต่อ LINE...</div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                <input type="text" id="title" placeholder="เช่น แจ้งท่อประปาชำรุด" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียด <span class="text-red-500">*</span></label>
                <textarea id="detail" rows="3" placeholder="พิมพ์เนื้อหาที่ต้องการแจ้งให้สมาชิกทราบ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รูปภาพประกอบ (ถ้ามี)</label>
                <div class="relative group cursor-pointer border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50 hover:bg-blue-100 transition h-36 flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('imageFile').click()">
                    <img id="preview" class="absolute inset-0 w-full h-full object-cover rounded-2xl hidden z-10">
                    <div id="placeholder" class="text-blue-400 text-center relative z-0 transition-transform group-hover:scale-110">
                        <i class="fas fa-image text-3xl mb-1"></i>
                        <p class="text-xs font-bold">แตะเพื่อเลือกรูปภาพ</p>
                    </div>
                </div>
                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="previewImage(this)">
            </div>

            <button id="btn-submit" onclick="submitBroadcast()" class="w-full py-4 mt-4 bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-700 hover:to-sky-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all text-sm flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน
            </button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
    <script>
        // ⚠️ ใส่ลิงก์ API Script.google.com ของคุณ
        const API_URL = "https://script.google.com/macros/s/AKfycbz_rkhS9bIVqcWGTNa2PhGfdw0Ik3cWy6rHzSU_pYtR9nQY7PupMSUdfqLaUgUGBLtj/exec"; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = type === 'error' ? 'fa-times-circle' : (type === 'warning' ? 'fa-exclamation-triangle' : 'fa-check-circle');
            let bgClass = type === 'error' ? 'bg-rose-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-emerald-500');

            toast.className = `${bgClass} text-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] flex flex-col transform scale-90 opacity-0 transition-all duration-300 ease-out pointer-events-auto w-full max-w-[280px] overflow-hidden`;
            toast.innerHTML = `<div class="p-6 flex flex-col items-center justify-center gap-3 text-center"><i class="fas ${icon} text-5xl drop-shadow-md mb-1"></i><div class="font-bold text-[16px] leading-relaxed drop-shadow-sm w-full">${message}</div></div>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('scale-90', 'opacity-0'); toast.classList.add('scale-100', 'opacity-100'); }, 10);
            setTimeout(() => { toast.classList.remove('scale-100', 'opacity-100'); toast.classList.add('scale-95', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.onload = () => {
            // ⚠️ ใส่รหัส LIFF ID ที่คุณสร้างสำหรับแบบฟอร์มกระจายข่าวนี้
            liff.init({ liffId: "2009962202-57vwaEPq" }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        document.getElementById('uid').value = profile.userId;
                        document.getElementById('profile-name').innerText = profile.displayName;
                    });
                } else { liff.login(); }
            });
        };

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const preview = document.getElementById('preview');
                preview.src = URL.createObjectURL(input.files[0]);
                preview.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
            }
        }

        function submitBroadcast() {
            const lineId = document.getElementById('uid').value; 
            const title = document.getElementById('title').value.trim();
            const detail = document.getElementById('detail').value.trim();
            const fileInput = document.getElementById('imageFile');
            const btn = document.getElementById('btn-submit');

            if (!lineId) return showToast('กำลังประมวลผลข้อมูล LINE โปรดรอสักครู่...', 'warning');
            if (!title) return showToast('กรุณาระบุหัวข้อประกาศ', 'warning');
            if (!detail) return showToast('กรุณาระบุรายละเอียดข้อความ', 'warning');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังส่งข้อมูล...';

            const sendData = (base64Img) => {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'sendBroadcast',
                        lineId: lineId, 
                        title: title,
                        detail: detail,
                        imageBlob: base64Img
                    })
                }).then(res => res.json()).then(data => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน';

                    if(data.success) {
                        showToast(data.message, 'success');
                        setTimeout(() => {
                            if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
                                liff.closeWindow();
                            } else { window.close(); }
                        }, 3000);
                    } else {
                        showToast(data.message, 'error');
                    }
                }).catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน';
                    showToast('การเชื่อมต่อล้มเหลว', 'error');
                });
            };

            if (fileInput.files[0]) {
                const img = new Image();
                const objectUrl = URL.createObjectURL(fileInput.files[0]);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl); 
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    sendData(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = objectUrl;
            } else {
                sendData(""); // ถ้าไม่มีรูป ก็ส่งข้อความเปล่าๆ ไป
            }
        }
    </script>
</body>
</html>
