<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งข่าวสาร ประปาหมู่บ้าน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen relative overflow-x-hidden">

    <div id="toast-container" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[9999] flex flex-col items-center gap-3 pointer-events-none w-full px-6"></div>

    <!-- ⏳ หน้าจอ Loading เช็คสิทธิ์ -->
    <div id="loading-screen" class="w-full max-w-md flex flex-col items-center justify-center py-20">
        <div id="loading-spinner" class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
        <h3 id="loading-title" class="text-lg font-bold text-slate-700">กำลังตรวจสอบสิทธิ์...</h3>
        <p id="loading-message" class="text-sm text-slate-500">กรุณารอสักครู่</p>
        <button id="retry-button" onclick="window.location.reload()" class="hidden mt-4 px-5 py-2 bg-blue-600 text-white font-bold rounded-xl">ลองอีกครั้ง</button>
    </div>

    <!-- ⛔ หน้าต่างป๊อปอัป ไม่มีสิทธิ์เข้าถึง (เพิ่มใหม่ ค้างไว้จนกว่าจะกดปิด) -->
    <div id="unauthorized-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div id="unauthorized-box" class="bg-white rounded-[2rem] p-6 shadow-2xl max-w-xs sm:max-w-sm w-full text-center transform scale-95 transition-all duration-300 relative border border-slate-100">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-50 mb-4 shadow-inner border border-rose-100">
                <i class="fas fa-lock text-2xl text-rose-500"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">ไม่มีสิทธิ์เข้าถึง</h3>
            <p class="text-[14px] text-slate-500 mb-6 leading-relaxed font-medium">
                ⛔ ขออภัยครับ<br>เฉพาะคณะกรรมการหมู่บ้านเท่านั้น<br>ที่สามารถใช้งานส่วนนี้ได้
            </p>
            <button onclick="closeAndExit()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95 shadow-md shadow-rose-500/30">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- 📝 หน้าจอแบบฟอร์ม (ซ่อนไว้ก่อนจนกว่าจะเช็คสิทธิ์ผ่าน) -->
    <div id="form-container" class="bg-white w-full max-w-md rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 hidden">
        <div class="bg-gradient-to-r from-sky-500 to-blue-600 py-4 px-6 text-white shadow-md relative flex items-center gap-4">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl shrink-0 backdrop-blur-sm border border-white/30">
                <i class="fas fa-bullhorn"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold leading-tight">ประกาศ / แจ้งข่าวสาร</h2>
                <p class="text-[11px] text-blue-100 mt-0.5">หมู่ที่ 5 บ้านทับพรุ</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center gap-3 shadow-inner mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 overflow-hidden shrink-0">
                    <img id="profile-avatar" class="hidden w-full h-full object-cover" alt="รูปโปรไฟล์ LINE">
                    <span id="profile-avatar-fallback"><i class="fas fa-user-tie"></i></span>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">คณะกรรมการ</div>
                    <div id="profile-name" class="text-sm font-bold text-slate-700 mt-0.5">กำลังเชื่อมต่อ LINE...</div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                <input type="text" id="title" maxlength="100" placeholder="เช่น แจ้งท่อประปาชำรุด" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียด <span class="text-red-500">*</span></label>
                <textarea id="detail" rows="3" maxlength="2000" placeholder="พิมพ์เนื้อหาที่ต้องการแจ้งให้สมาชิกทราบ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รูปภาพประกอบ (ถ้ามี)</label>
                <div class="relative group cursor-pointer border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50 hover:bg-blue-100 transition h-36 flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('imageFile').click()">
                    <img id="preview" class="absolute inset-0 w-full h-full object-cover rounded-2xl hidden z-10">
                    <div id="placeholder" class="text-blue-400 text-center relative z-0 transition-transform group-hover:scale-110">
                        <i class="fas fa-image text-3xl mb-1"></i>
                        <p class="text-xs font-bold">แตะเพื่อเลือกรูปภาพ</p>
                    </div>
                </div>
                <input type="file" id="imageFile" accept="image/*" capture="environment" class="hidden" onchange="previewImage(this)">
            </div>

            <button id="btn-submit" onclick="submitBroadcast()" class="w-full py-4 mt-4 bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-700 hover:to-sky-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all text-sm flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน
            </button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
    <script>
        // ⚠️ ใส่ลิงก์ API Script.google.com ของคุณรณรงค์
        const API_URL = "https://script.google.com/macros/s/AKfycbzq88OZCsNZqxdmfe4otNoypsepDeVj-baYlTwEYIFlTtU9wqiUNKbPh76XJYy4Ys6uTw/exec"; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'fa-check-circle';
            let bgClass = 'bg-emerald-500';

            if (type === 'error') {
                icon = 'fa-times-circle'; 
                bgClass = 'bg-rose-600'; 
            } else if (type === 'warning' || type === 'info') {
                icon = type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle';
                bgClass = type === 'warning' ? 'bg-amber-500' : 'bg-blue-500';
            }

            // ตั้งค่าพื้นหลังสีทึบ ตัวอักษรสีขาวเงาเด่นๆ และเพิ่ม border
            toast.className = `${bgClass} text-white rounded-[1.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] flex flex-col transform scale-90 opacity-0 transition-all duration-300 ease-out pointer-events-auto w-full max-w-[280px] overflow-hidden border border-white/20`;
            
            toast.innerHTML = `
                <div class="p-6 flex flex-col items-center justify-center gap-3 text-center relative">
                    <!-- ปุ่มกากบาทมุมขวาบน สำหรับกดปิดทันที -->
                    <button onclick="this.closest('.flex-col').remove()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/10 hover:bg-black/20 flex items-center justify-center transition-colors">
                        <i class="fas fa-times text-sm"></i>
                    </button>
                    
                    <i class="fas ${icon} text-5xl drop-shadow-md mb-1"></i>
                    <div class="toast-message font-bold text-[16px] leading-relaxed drop-shadow-sm w-full"></div>
                </div>
                <!-- 🌟 แถบเวลาสีขาววิ่งด้านล่าง -->
                <div class="w-full h-1.5 bg-black/20">
                    <div class="h-full bg-white transition-all duration-[2500ms] ease-linear rounded-r-full" style="width: 100%;"></div>
                </div>
            `;
            toast.querySelector('.toast-message').textContent = String(message);
            
            container.appendChild(toast);

            // เด้งและชัดขึ้น (Fade In & Scale Up)
            setTimeout(() => {
                toast.classList.remove('scale-90', 'opacity-0');
                toast.classList.add('scale-100', 'opacity-100');
                
                // ให้หลอดเวลาเริ่มหดลง
                setTimeout(() => {
                    const progressBar = toast.querySelector('div.h-full');
                    if (progressBar) progressBar.style.width = '0%';
                }, 50);
            }, 10);

            // ค่อยๆ จางหายไป (Fade Out) หลังจากเวลาผ่านไป 2.5 วินาที
            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100');
                toast.classList.add('scale-95', 'opacity-0'); 
                
                // ลบทิ้งหลังจากจางเสร็จ
                setTimeout(() => toast.remove(), 300);
            }, 2500); 
        }

        // 🌟 1. ฟังก์ชันแสดงหน้าต่าง ไม่มีสิทธิ์เข้าถึง
        function showUnauthorizedModal() {
            const modal = document.getElementById('unauthorized-modal');
            const box = document.getElementById('unauthorized-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            }, 10);
        }

        // 🌟 2. ฟังก์ชันกดปุ่ม "ปิดหน้าต่าง"
        function closeAndExit() {
            if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
                liff.closeWindow();
            } else {
                showToast('ส่งประกาศเสร็จแล้ว สามารถปิดแท็บนี้ได้', 'info');
            }
        }

        function showInitializationError(message) {
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('loading-title').textContent = 'เชื่อมต่อไม่สำเร็จ';
            document.getElementById('loading-message').textContent = message;
            document.getElementById('retry-button').classList.remove('hidden');
        }

        async function postApi(payload) {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด');
            return response.json();
        }

        async function initializeBroadcastForm() {
            try {
                await liff.init({ liffId: "2009984616-PQGvzBFq" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const idToken = liff.getIDToken();
                if (!idToken) throw new Error('ไม่พบข้อมูลยืนยันตัวตนจาก LINE');

                const data = await postApi({ action: 'checkDirector', idToken: idToken });
                document.getElementById('loading-screen').classList.add('hidden');

                if (!data.success) throw new Error(data.message || 'ตรวจสอบสิทธิ์ไม่สำเร็จ');
                if (!data.isDirector) {
                    showUnauthorizedModal();
                    return;
                }

                document.getElementById('profile-name').textContent = data.name || profile.displayName;
                if (profile.pictureUrl) {
                    const avatar = document.getElementById('profile-avatar');
                    avatar.src = profile.pictureUrl;
                    avatar.classList.remove('hidden');
                    document.getElementById('profile-avatar-fallback').classList.add('hidden');
                }
                document.getElementById('form-container').classList.remove('hidden');
            } catch (error) {
                showInitializationError(error.message || 'กรุณาตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง');
            }
        }

        window.onload = initializeBroadcastForm;

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const preview = document.getElementById('preview');
                if (preview.dataset.objectUrl) URL.revokeObjectURL(preview.dataset.objectUrl);
                preview.dataset.objectUrl = URL.createObjectURL(input.files[0]);
                preview.src = preview.dataset.objectUrl;
                preview.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
            }
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                if (file.size > 15 * 1024 * 1024) {
                    reject(new Error('รูปภาพต้นฉบับต้องมีขนาดไม่เกิน 15 MB'));
                    return;
                }

                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    try {
                        const scale = Math.min(1, 800 / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        const context = canvas.getContext('2d');
                        if (!context) throw new Error('ไม่สามารถประมวลผลรูปภาพได้');
                        context.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg', 0.6);
                        if (imageData.length > 7 * 1024 * 1024) {
                            throw new Error('รูปภาพหลังบีบอัดมีขนาดใหญ่เกินกำหนด');
                        }
                        resolve(imageData);
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('อ่านรูปภาพไม่สำเร็จ กรุณาเลือกรูปอื่น'));
                };
                img.src = objectUrl;
            });
        }

        async function submitBroadcast() {
            const title = document.getElementById('title').value.trim();
            const detail = document.getElementById('detail').value.trim();
            const fileInput = document.getElementById('imageFile');
            const btn = document.getElementById('btn-submit');

            if (!title) return showToast('กรุณาระบุหัวข้อประกาศ', 'warning');
            if (!detail) return showToast('กรุณาระบุรายละเอียดข้อความ', 'warning');
            if (title.length > 100) return showToast('หัวข้อประกาศต้องไม่เกิน 100 ตัวอักษร', 'warning');
            if (detail.length > 2000) return showToast('รายละเอียดต้องไม่เกิน 2,000 ตัวอักษร', 'warning');
            if (!liff.isLoggedIn()) return showToast('กรุณาเข้าสู่ระบบ LINE ใหม่', 'error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังส่งข้อมูล...';

            try {
                const idToken = liff.getIDToken();
                if (!idToken) throw new Error('ไม่พบข้อมูลยืนยันตัวตนจาก LINE กรุณาโหลดหน้าใหม่');
                const imageBlob = fileInput.files[0] ? await compressImage(fileInput.files[0]) : '';
                const data = await postApi({
                    action: 'sendBroadcast',
                    idToken: idToken,
                    title: title,
                    detail: detail,
                    imageBlob: imageBlob
                });

                if (data.success) {
                    showToast(data.message, 'success');
                    setTimeout(closeAndExit, 2500);
                } else {
                    showToast(data.message || 'ส่งประกาศไม่สำเร็จ', 'error');
                }
            } catch (error) {
                showToast(error.message || 'การเชื่อมต่อล้มเหลว', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งประกาศให้สมาชิกทุกคน';
            }
        }
    </script>
</body>
</html>
