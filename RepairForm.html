<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งซ่อมประปาบ้านทับพรุ</title>
    
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen relative overflow-x-hidden">

    <div id="toast-container" class="fixed top-3 left-3 right-3 z-[9999] flex flex-col items-end gap-3 pointer-events-none sm:top-6 sm:right-6 sm:left-auto"></div>

    <div class="bg-white w-full max-w-md rounded-[2rem] shadow-xl overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-red-500 to-rose-600 py-4 px-6 text-white shadow-md relative flex items-center gap-4">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl shrink-0 backdrop-blur-sm border border-white/30">
                <i class="fas fa-tools"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold leading-tight">แจ้งท่อแตก / น้ำรั่ว</h2>
                <p class="text-[11px] text-rose-100 mt-0.5">หมู่ที่ 5 บ้านทับพรุ</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <input type="hidden" id="uid" value="">
            <input type="hidden" id="lineName" value="">

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center gap-3 shadow-inner">
                <img id="profile-img" src="https://via.placeholder.com/150?text=LINE" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm">
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">บัญชีผู้แจ้ง</div>
                    <div id="profile-name" class="text-sm font-bold text-slate-700 mt-0.5">กำลังเชื่อมต่อข้อมูล LINE...</div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียดจุดที่ชำรุด</label>
                <textarea id="detail" rows="2" placeholder="ระบุรายละเอียด เช่น ท่อเมนแตกหน้าบ้านซอย 1..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">ถ่ายภาพจุดที่ชำรุด (บังคับ)</label>
                <div class="relative group cursor-pointer border-2 border-dashed border-red-200 rounded-2xl bg-red-50 hover:bg-red-100 transition h-32 flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('imageFile').click()">
                    <img id="preview" class="absolute inset-0 w-full h-full object-cover rounded-2xl hidden z-10">
                    <div id="placeholder" class="text-red-400 text-center relative z-0 transition-transform group-hover:scale-110">
                        <i class="fas fa-camera text-3xl mb-1"></i>
                        <p class="text-xs font-bold">แตะเพื่อถ่ายรูป</p>
                    </div>
                </div>
                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="previewImage(this)">
            </div>

            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                    <div class="text-xs font-bold text-blue-800">พิกัด GPS</div>
                    <div id="gps-status" class="text-[10px] text-blue-500 font-medium">รอการดึงพิกัด...</div>
                </div>
                <button type="button" onclick="getLocation()" class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition-transform shadow-sm"><i class="fas fa-map-marker-alt"></i> ดึงใหม่</button>
            </div>
            <input type="hidden" id="lat"><input type="hidden" id="lng">

            <button id="btn-submit" onclick="submitRepair()" class="w-full py-4 mt-2 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-bold rounded-xl shadow-lg shadow-red-500/30 active:scale-[0.98] transition-all text-sm flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> ส่งข้อมูลให้ทีมช่าง
            </button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
    
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzq88OZCsNZqxdmfe4otNoypsepDeVj-baYlTwEYIFlTtU9wqiUNKbPh76XJYy4Ys6uTw/exec"; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) {
                console.error('ไม่พบพื้นที่แสดงข้อความแจ้งเตือน');
                return;
            }

            const styles = {
                success: { title: 'สำเร็จ', icon: 'fa-circle-check', iconColor: 'text-emerald-600', iconBg: 'bg-emerald-50', border: 'border-emerald-100', progress: 'bg-emerald-500', duration: 2500 },
                error: { title: 'เกิดข้อผิดพลาด', icon: 'fa-circle-xmark', iconColor: 'text-rose-600', iconBg: 'bg-rose-50', border: 'border-rose-100', progress: 'bg-rose-500', duration: 6000 },
                warning: { title: 'แจ้งเตือน', icon: 'fa-triangle-exclamation', iconColor: 'text-amber-600', iconBg: 'bg-amber-50', border: 'border-amber-100', progress: 'bg-amber-500', duration: 5000 },
                info: { title: 'ข้อมูล', icon: 'fa-circle-info', iconColor: 'text-sky-600', iconBg: 'bg-sky-50', border: 'border-sky-100', progress: 'bg-sky-500', duration: 4200 }
            };
            const style = styles[type] || styles.success;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto w-full overflow-hidden rounded-2xl border ${style.border} bg-white shadow-[0_12px_35px_rgba(15,23,42,0.14)] opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-3 transition-all duration-300`;
            toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
            toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

            const content = document.createElement('div');
            content.className = 'flex items-start gap-3 p-4';
            const iconBox = document.createElement('div');
            iconBox.className = `mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${style.iconBg}`;
            const icon = document.createElement('i');
            icon.className = `fas ${style.icon} ${style.iconColor} text-lg`;
            icon.setAttribute('aria-hidden', 'true');
            iconBox.appendChild(icon);

            const textBox = document.createElement('div');
            textBox.className = 'min-w-0 flex-1 pt-0.5';
            const title = document.createElement('div');
            title.className = 'text-sm font-bold text-slate-800';
            title.textContent = style.title;
            const detail = document.createElement('div');
            detail.className = 'mt-0.5 whitespace-pre-line break-words text-[13px] leading-relaxed text-slate-600';
            detail.textContent = String(message ?? '');
            textBox.append(title, detail);

            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.className = 'flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700';
            closeButton.setAttribute('aria-label', 'ปิดการแจ้งเตือน');
            closeButton.innerHTML = '<i class="fas fa-times" aria-hidden="true"></i>';
            content.append(iconBox, textBox, closeButton);

            const progressTrack = document.createElement('div');
            progressTrack.className = 'h-1 w-full bg-slate-100';
            const progress = document.createElement('div');
            progress.className = `h-full w-full ${style.progress} transition-[width] ease-linear`;
            progress.style.transitionDuration = `${style.duration}ms`;
            progressTrack.appendChild(progress);
            toast.append(content, progressTrack);
            container.appendChild(toast);

            let dismissTimer;
            const dismiss = () => {
                if (!toast.isConnected) return;
                toast.classList.add('opacity-0', 'translate-y-2', 'sm:translate-x-3');
                setTimeout(() => toast.remove(), 300);
            };
            closeButton.addEventListener('click', () => {
                clearTimeout(dismissTimer);
                dismiss();
            });
            toast.addEventListener('mouseenter', () => {
                clearTimeout(dismissTimer);
                progress.style.transitionDuration = '0ms';
                progress.style.width = '100%';
            });
            toast.addEventListener('mouseleave', () => {
                progress.style.transitionDuration = `${style.duration}ms`;
                progress.style.width = '0%';
                dismissTimer = setTimeout(dismiss, style.duration);
            });
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2', 'sm:translate-x-3');
                progress.style.width = '0%';
            });
            dismissTimer = setTimeout(dismiss, style.duration);
        }

        window.onload = () => {
            liff.init({ liffId: "2009984616-PQGvzBFq" }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        document.getElementById('uid').value = profile.userId;
                        document.getElementById('lineName').value = profile.displayName; 
                        document.getElementById('profile-name').innerText = profile.displayName;
                        if(profile.pictureUrl) {
                            document.getElementById('profile-img').src = profile.pictureUrl;
                        }
                        getLocation();
                    }).catch(err => {
                        document.getElementById('profile-name').innerText = "ดึงข้อมูลโปรไฟล์ไม่สำเร็จ";
                        document.getElementById('profile-name').classList.add("text-red-500");
                        getLocation();
                    });
                } else { 
                    liff.login(); 
                }
            }).catch(err => {
                document.getElementById('profile-name').innerText = "ไม่ได้ตั้งค่า LIFF ID หรือเปิดนอก LINE";
                document.getElementById('profile-name').classList.add("text-red-500");
                getLocation();
            });
        };

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const preview = document.getElementById('preview');
                
                // ใช้ createObjectURL แทน FileReader (ทำงานเร็วกว่าและไม่ทำให้เว็บค้าง)
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
            }
        }

        function getLocation() {
            const status = document.getElementById('gps-status');
            status.innerText = "กำลังค้นหาพิกัด...";
            status.classList.replace('text-red-500', 'text-blue-500');
            status.classList.replace('text-green-600', 'text-blue-500');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('lat').value = position.coords.latitude;
                        document.getElementById('lng').value = position.coords.longitude;
                        status.innerText = "✅ ได้รับพิกัดเรียบร้อย";
                        status.classList.replace('text-blue-500', 'text-green-600');
                    },
                    (error) => {
                        console.warn("GPS Error:", error.message);
                        status.innerText = "❌ กรุณาเปิด GPS และอนุญาตตำแหน่ง";
                        status.classList.replace('text-blue-500', 'text-red-500');
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000, 
                        maximumAge: 60000 
                    }
                );
            } else {
                status.innerText = "อุปกรณ์ไม่รองรับ GPS";
            }
        }

        function submitRepair() {
            const lineId = document.getElementById('uid').value; 
            const lineName = document.getElementById('lineName').value; 
            const detail = document.getElementById('detail').value.trim();
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;
            const fileInput = document.getElementById('imageFile');
            const btn = document.getElementById('btn-submit');

            if (!lineId) return showToast('กำลังประมวลผลข้อมูล LINE โปรดรอสักครู่...', 'warning');
            if (!detail) return showToast('กรุณาระบุรายละเอียดที่ชำรุดด้วยครับ', 'warning');
            if (!fileInput.files[0]) return showToast('กรุณาถ่ายภาพจุดที่ชำรุดประกอบการแจ้งซ่อม', 'warning');
            if (!lat || !lng) return showToast('กรุณารอระบบดึงพิกัด GPS หรือกดดึงใหม่', 'warning');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังส่งข้อมูล...';

            const file = fileInput.files[0];
            const img = new Image();
            
            // สร้าง URL ชั่วคราวจากไฟล์แทนการโหลดข้อมูลดิบทั้งหมด
            const objectUrl = URL.createObjectURL(file);

            img.onload = () => {
                // คืนหน่วยความจำให้ระบบทันที ป้องกันแอปค้าง
                URL.revokeObjectURL(objectUrl); 

                const canvas = document.createElement('canvas');
                let width = img.width; 
                let height = img.height;
                const MAX = 800; // ขนาดความกว้างสูงสุด
                
                if (width > MAX) { 
                    height *= MAX / width; 
                    width = MAX; 
                }
                
                canvas.width = width; 
                canvas.height = height;
                
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'low'; 
                ctx.drawImage(img, 0, 0, width, height);
                
                // ลด Quality ลงเหลือ 0.5 (รูปยังชัดเจนสำหรับงานซ่อม แต่ขนาดไฟล์เล็กลง ส่งขึ้น Server ไวขึ้นมาก)
                const base64 = canvas.toDataURL('image/jpeg', 0.5); 

                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'submitRepair',
                        lineId: lineId, 
                        lineName: lineName, 
                        detail: detail,
                        lat: lat,
                        lng: lng,
                        imageBlob: base64
                    })
                }).then(res => res.json()).then(data => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งข้อมูลให้ทีมช่าง';

                    if(data.success) {
                        showToast('✅ ส่งเรื่องแจ้งซ่อมเรียบร้อยแล้วครับ!', 'success');
                        
                        // เคลียร์ค่า
                        document.getElementById('detail').value = '';
                        document.getElementById('imageFile').value = '';
                        document.getElementById('preview').classList.add('hidden');
                        document.getElementById('placeholder').classList.remove('hidden');

                        // หน่วงเวลาให้ผู้ใช้ได้อ่านแจ้งเตือนก่อนปิดหน้าต่าง
                        setTimeout(() => {
                            if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
                                liff.closeWindow();
                            } else {
                                window.close(); 
                            }
                        }, 2500);

                    } else {
                        showToast('ขัดข้อง: ' + data.message, 'error');
                    }
                }).catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งข้อมูลให้ทีมช่าง';
                    showToast('การเชื่อมต่อล้มเหลว โปรดลองอีกครั้ง', 'error');
                });
            };
            
            // สั่งให้ Image เริ่มโหลดข้อมูลจาก URL ชั่วคราว
            img.src = objectUrl;
        }
    </script>
</body>
</html>
